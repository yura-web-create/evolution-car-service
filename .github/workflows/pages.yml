# Собирает сайт и публикует на GitHub Pages при каждом push в main.
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Сайт собирается под тот адрес, по которому он реально откроется.
      # Индексация намеренно закрыта: служебный адрес не должен попадать в поиск.
      # Переедет на свой домен — добавить сюда INDEXABLE: '1'.
      - name: Build site for the Pages URL
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 pages.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
